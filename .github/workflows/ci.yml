name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish to NuGet'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true
  Deterministic: true

# Cancel superseded runs: a newer commit on the same PR/branch cancels older
# in-progress runs. Manual workflow_dispatch runs (e.g. NuGet publish) are never
# cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Docs-only changes skip the expensive jobs entirely. Everything downstream
  # gates on the `code` output; `ci-passed` (the single required check) treats
  # skipped jobs as success, so branch protection keeps working.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Positive allowlist: anything matching runs full CI. Docs, markdown,
          # and agent config fall through and skip CI.
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'tools/**'
              - 'scripts/**'
              - 'samples/**'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.config/**'
              - '**/*.csproj'
              - '**/dotnet-tools.json'
              - '**/*.props'
              - '**/*.targets'
              - '**/global.json'
              - '**/nuget.config'
              - '**/NuGet.config'
              - '**/packages.config'
              - '**/packages.lock.json'
              - '*.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'nuget.config'
              - '.editorconfig'
              - '.gitattributes'
            docs:
              - 'README.md'
              - 'docs/docs/**'
              - 'src/**'
              - 'tests/Dekaf.DocTests/**'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'

  doc-snippets:
    name: Documentation Snippets
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compile documentation snippets
        run: dotnet run --project tests/Dekaf.DocTests --configuration Release --framework net10.0 -- --repository-root .

  nuget-audit:
    name: NuGet Vulnerability Audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets', '**/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test vulnerability gate
        shell: pwsh
        run: ./scripts/Test-NuGetVulnerabilityAudit.ps1

      - name: Audit direct and transitive dependencies
        shell: pwsh
        run: >-
          ./scripts/Invoke-NuGetVulnerabilityAudit.ps1
          -RepositoryRoot .
          -OutputPath artifacts/nuget-audit/nuget-vulnerabilities.json

      - name: Upload vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nuget-vulnerability-report
          path: artifacts/nuget-audit/nuget-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 30

  # The ONLY job that compiles the full solution. Every test job downloads the
  # binaries it needs from here instead of rebuilding, so this job sits on the
  # critical path and carries no test execution of its own: the net10.0 unit
  # tests run in `unit-net10`, alongside the integration matrix.
  build:
    name: Build & Pack
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read  # Publishing (and its release/tag creation) lives in the gated publish job

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup .NET 8 runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        continue-on-error: true  # Don't fail if GitVersion has issues on PR branches

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run Pipeline
        env:
          NET_VERSION: net10.0
          # Unit tests run in their own job off this job's critical path, and AOT
          # and integration have dedicated jobs too. Packaging stays on: the GSSAPI
          # smoke build below and the nuget-packages artifact both need it.
          SKIP_UNIT_TESTS: 'true'
          SKIP_INTEGRATION_TESTS: 'true'
          SKIP_AOT_SMOKE_TESTS: 'true'
          # Publishing happens in the gated publish job after the full release
          # matrix is green — never here.
          NuGet__ShouldPublish: 'false'
        run: dotnet run --project tools/Dekaf.Pipeline

      - name: Verify native MTP test discovery
        run: >-
          dotnet test --project tests/Dekaf.Tests.Unit
          --configuration Release --framework net10.0 --no-build --list-tests
          --treenode-filter "/*/*/AdminClientFeatureTests/DescribeFeaturesAsync_MapsConnectionCapabilitySnapshot"
          --minimum-expected-tests 1

      - name: Test Public API Gate
        shell: pwsh
        run: ./scripts/Test-PublicApiGate.ps1

      - name: Test Abstractions Binary Compatibility
        shell: pwsh
        run: ./scripts/Test-AbstractionsBinaryCompatibility.ps1

      - name: Build clean GSSAPI package consumers
        shell: pwsh
        run: ./scripts/Build-GssapiPackageSmoke.ps1

      # One tarball per consumer instead of a single 400+ MB tarball that every
      # test job downloads whole: an integration group no longer fetches and
      # unpacks the unit binaries and the other framework's copy. tar preserves
      # the apphost executable bit, and one file per artifact keeps uploads fast.
      - name: Package test binaries
        run: |
          tar -czf unit-net8.0.tar.gz tests/Dekaf.Tests.Unit/bin/Release/net8.0
          tar -czf unit-net10.0.tar.gz tests/Dekaf.Tests.Unit/bin/Release/net10.0 tools/Dekaf.StressTests.Tests/bin/Release/net10.0
          tar -czf integration-net8.0.tar.gz tests/Dekaf.Tests.Integration/bin/Release/net8.0
          tar -czf integration-net10.0.tar.gz tests/Dekaf.Tests.Integration/bin/Release/net10.0
          tar -czf gssapi-package-smoke.tar.gz artifacts/gssapi-package-smoke/net8.0 artifacts/gssapi-package-smoke/net10.0

      - name: Upload unit test binaries (net8.0)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-binaries-unit-net8.0
          path: unit-net8.0.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload unit test binaries (net10.0)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-binaries-unit-net10.0
          path: unit-net10.0.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload integration test binaries (net8.0)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-binaries-integration-net8.0
          path: integration-net8.0.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload integration test binaries (net10.0)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-binaries-integration-net10.0
          path: integration-net10.0.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload GSSAPI package smoke consumers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gssapi-package-smoke
          path: gssapi-package-smoke.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages
          path: |
            **/bin/Release/*.nupkg
            **/bin/Release/*.snupkg
          if-no-files-found: ignore
          retention-days: 30

  gssapi-packages:
    name: GSSAPI NuGet consumers (.NET 8 and .NET 10)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Kerberos tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries-integration-net8.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries-integration-net10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gssapi-package-smoke
      - name: Run authenticated package round trips
        run: |
          tar -xzf integration-net8.0.tar.gz
          tar -xzf integration-net10.0.tar.gz
          tar -xzf gssapi-package-smoke.tar.gz
          for framework in net8.0 net10.0; do
            export DEKAF_KERBEROS_PACKAGE_CLIENT="$PWD/artifacts/gssapi-package-smoke/$framework/Dekaf.PackageSmoke.Gssapi.dll"
            dotnet "tests/Dekaf.Tests.Integration/bin/Release/$framework/Dekaf.Tests.Integration.dll" \
              --treenode-filter '/*/*/GssapiAuthenticationIntegrationTests/*' \
              --minimum-expected-tests 1 --results-directory "TestResults/gssapi-packages/$framework"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-gssapi-packages
          path: TestResults/gssapi-packages
          retention-days: 7

  # The net10.0 unit suite (and the stress harness's own unit tests) against the
  # prebuilt binaries. Its own job so it runs alongside the integration matrix
  # instead of holding every downstream job behind the build.
  unit-net10:
    name: Unit Tests (net10.0)
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout  # Verify snapshot files are read from the repo at runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries-unit-net10.0

      - name: Extract test binaries
        run: tar -xzf unit-net10.0.tar.gz

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run unit tests
        env:
          NET_VERSION: net10.0
        run: |
          exe=tests/Dekaf.Tests.Unit/bin/Release/net10.0/Dekaf.Tests.Unit
          chmod +x "$exe"
          "$exe" --hangdump --hangdump-timeout 5m --log-level Debug

      - name: Run stress harness unit tests
        env:
          NET_VERSION: net10.0
        run: |
          exe=tools/Dekaf.StressTests.Tests/bin/Release/net10.0/Dekaf.StressTests.Tests
          chmod +x "$exe"
          "$exe" --hangdump --hangdump-timeout 5m --log-level Debug

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-unit-net10.0
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-unit-net10.0
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  unit-net8:
    name: Unit Tests (net8.0)
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout  # Verify snapshot files are read from the repo at runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries-unit-net8.0

      - name: Extract test binaries
        run: tar -xzf unit-net8.0.tar.gz

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Run unit tests
        env:
          NET_VERSION: net8.0
        run: |
          exe=tests/Dekaf.Tests.Unit/bin/Release/net8.0/Dekaf.Tests.Unit
          chmod +x "$exe"
          "$exe" --hangdump --hangdump-timeout 5m --log-level Debug

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-unit-net8.0
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-unit-net8.0
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  # The produce-path leak gates carry ProducerDebugCounters balance assertions
  # (rent/return parity, zero duplicate pool returns, completion-source
  # conservation) that are [Conditional("DEBUG")] — compiled out of the Release
  # binaries every other job runs. This leg builds the unit test project in
  # Debug so those invariants actually execute. Free runner; builds only the
  # test project (ProjectReference pulls Dekaf in Debug).
  leak-gates-debug:
    name: Leak Gates (Debug counters)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build unit tests (Debug)
        run: dotnet build tests/Dekaf.Tests.Unit --configuration Debug

      - name: Run leak gates with debug counters
        run: >-
          ./tests/Dekaf.Tests.Unit/bin/Debug/net10.0/Dekaf.Tests.Unit
          --hangdump --hangdump-timeout 10m
          --treenode-filter
          "/*/*/(ProducerMemoryLeakGateTests|ProducerLeakUnderLoadTests|ProducerLeakEdgeCaseTests|ProducerBatchLifecycleHammerTests|BrokerSenderLeakGateTests)/*"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-leak-gates-debug
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-leak-gates-debug
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  # Integration categories run via the shared group definitions in
  # integration-groups.yml against the prebuilt binaries (no rebuild).
  # PRs run net10.0 only; manual non-publish runs add net8.0. NuGet publish
  # dispatches skip this job — the release-matrix jobs below cover a superset.
  integration:
    name: Integration (${{ matrix.framework }})
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true)
    strategy:
      fail-fast: true
      matrix:
        framework: ${{ github.event_name == 'pull_request' && fromJSON('["net10.0"]') || fromJSON('["net8.0", "net10.0"]') }}
    uses: ./.github/workflows/integration-groups.yml
    with:
      framework: ${{ matrix.framework }}

  # Event Hubs emulator coverage is broker-version independent. Keep one
  # dedicated net10.0 lane instead of multiplying it through the Kafka matrix.
  eventhubs-integration:
    name: Event Hubs Emulator Integration
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries-integration-net10.0

      - name: Extract test binaries
        run: tar -xzf integration-net10.0.tar.gz

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Pre-pull Event Hubs emulator images
        run: |
          bash scripts/prepull-kafka-images.sh \
            "mcr.microsoft.com/azure-messaging/eventhubs-emulator:2.2.1@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b" \
            "mcr.microsoft.com/azure-storage/azurite:3.36.0@sha256:76b8127d608fab8287a14a4bfeb9a5502cdcffb4bf1e86f09f324ebb0e70edba" \
            "testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0"

      - name: Run Event Hubs emulator integration tests
        run: bash scripts/run-integration-categories.sh net10.0 "EventHubs"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-eventhubs-net10.0
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-eventhubs-net10.0
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  # Release gate: a NuGet publish dispatch must pass the full matrix — both
  # frameworks across every supported broker version, plus the complete AOT
  # sweep on floor and current — before the publish job below pushes packages.
  release-matrix:
    name: Release Matrix
    needs: [changes, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
        kafka: ['4.0.2', '4.1.2', '4.2.1', '4.3.1']
    uses: ./.github/workflows/integration-groups.yml
    with:
      framework: ${{ matrix.framework }}
      kafka-tag: ${{ matrix.kafka }}
      fail-fast: false

  release-matrix-aot:
    name: Release Matrix AOT
    needs: [changes, aot-integration-publish]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true
    strategy:
      fail-fast: false
      matrix:
        kafka: ['4.0.2', '4.3.1']
    uses: ./.github/workflows/integration-groups.yml
    with:
      framework: aot
      kafka-tag: ${{ matrix.kafka }}
      fail-fast: false

  # Both NativeAOT smoke exes publish and run sequentially in one job — the
  # compute is the same as two matrix jobs but saves one runner slot + setup.
  aot-smoke:
    name: NativeAOT Smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify NativeAOT prerequisites
        run: |
          clang --version
          test -f /usr/include/zlib.h

      - name: Publish and run core smoke test
        run: |
          dotnet publish tests/Dekaf.Tests.Aot/Dekaf.Tests.Aot.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-x64 \
            --self-contained true \
            --output artifacts/aot/core \
            -p:PublishAot=true \
            -p:ContinuousIntegrationBuild=true \
            -p:TreatWarningsAsErrors=true
          ./artifacts/aot/core/Dekaf.Tests.Aot

      - name: Publish and run dependency-injection smoke test
        run: |
          dotnet publish tests/Dekaf.Tests.Aot.DependencyInjection/Dekaf.Tests.Aot.DependencyInjection.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-x64 \
            --self-contained true \
            --output artifacts/aot/dependency-injection \
            -p:PublishAot=true \
            -p:ContinuousIntegrationBuild=true \
            -p:TreatWarningsAsErrors=true
          ./artifacts/aot/dependency-injection/Dekaf.Tests.Aot.DependencyInjection

  aot-integration-publish:
    name: NativeAOT Integration Publish
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify NativeAOT prerequisites
        run: |
          clang --version
          test -f /usr/include/zlib.h

      - name: Publish NativeAOT integration executable
        run: |
          dotnet publish tests/Dekaf.Tests.Integration/Dekaf.Tests.Integration.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime linux-x64 \
            --self-contained true \
            --output artifacts/aot/integration \
            -p:PublishAot=true \
            -p:ContinuousIntegrationBuild=true \
            -p:TreatWarningsAsErrors=true

      - name: Upload NativeAOT integration executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-aot-integration
          path: artifacts/aot/integration/**
          if-no-files-found: error
          retention-days: 7

  # PR-lane AOT coverage is a smoke slice; the full category sweep runs in the
  # NuGet release gate.
  aot-integration-smoke:
    name: Integration Tests AOT (smoke)
    needs: [changes, aot-integration-publish]
    if: needs.changes.outputs.code == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAFKA_TEST_IMAGE_TAG: '4.3.1'

    steps:
      - name: Add Swap Space
        run: |
          sudo fallocate -l 8G /mnt/extra-swapfile
          sudo chmod 600 /mnt/extra-swapfile
          sudo mkswap /mnt/extra-swapfile
          sudo swapon /mnt/extra-swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download NativeAOT integration executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-aot-integration
          path: artifacts/aot/integration

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      # Keep the Ryuk image aligned with DotNet.Testcontainers in Directory.Packages.props.
      - name: Pre-pull integration images
        run: |
          bash scripts/prepull-kafka-images.sh \
            "$KAFKA_TEST_IMAGE_TAG" \
            4.0.2 \
            "testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0"

      - name: Run NativeAOT integration smoke tests
        run: bash scripts/run-integration-categories.sh aot "Producer,Consumer,Messaging,Serialization"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-integration-aot-smoke
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-integration-aot-smoke
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7

  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check Formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true  # Format check is informational

      - name: Run Python Script Unit Tests
        env:
          PYTHONPATH: .github/scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test PR Merge Gate
        shell: pwsh
        run: |
          ./scripts/Test-AssertPrGreenReviewHeuristics.ps1
          ./scripts/Test-AssertPrGreenReviewThreads.ps1

      - name: Test Integration Category Runner
        run: bash scripts/tests/run-integration-categories-tests.sh

  # Pushes NuGet packages and creates the GitHub release — only reachable when
  # the entire release matrix (plus the regular lanes) is green. Re-runs the
  # pipeline on the same commit, so GitVersion yields the same version the
  # build job computed.
  publish:
    name: Publish NuGet
    needs: [build, gssapi-packages, unit-net8, unit-net10, leak-gates-debug, eventhubs-integration, aot-smoke, aot-integration-publish, release-matrix, release-matrix-aot, code-quality, nuget-audit]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Declaring permissions drops all other scopes to none; contents:write is the only scope any
    # step here needs (release/tag creation). NuGet push authenticates with an API-key secret, and
    # artifact upload uses the exposed Actions runtime token — neither relies on GITHUB_TOKEN scopes.
    permissions:
      contents: write  # Create GitHub releases (and their tags) when publishing
      id-token: write  # Request a NuGet trusted publishing token

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup .NET 8 runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', '**/Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        continue-on-error: true

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Run Pipeline (publish)
        env:
          NET_VERSION: net10.0
          SKIP_INTEGRATION_TESTS: 'true'
          SKIP_AOT_SMOKE_TESTS: 'true'
          NuGet__ShouldPublish: 'true'
          NuGet__ApiKey: ${{ steps.login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Used by CreateReleaseModule when a publish ships packages
        run: dotnet run --project tools/Dekaf.Pipeline

      - name: Upload Packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages-published
          path: |
            **/bin/Release/*.nupkg
            **/bin/Release/*.snupkg
          if-no-files-found: ignore
          retention-days: 30

  # Single required status check for branch protection. Succeeds when every
  # upstream job succeeded or was skipped (docs-only PRs skip everything;
  # release-only jobs skip on PR runs).
  ci-passed:
    name: CI Passed
    needs: [changes, doc-snippets, build, gssapi-packages, unit-net8, unit-net10, leak-gates-debug, integration, eventhubs-integration, aot-smoke, aot-integration-publish, aot-integration-smoke, release-matrix, release-matrix-aot, publish, code-quality, nuget-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded or were skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .
          echo "$NEEDS_JSON" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
