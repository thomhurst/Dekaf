name: Integration Groups

# Reusable job matrix that runs all integration test categories, grouped into
# duration-balanced buckets, against prebuilt test binaries. Called by ci.yml
# for both the PR/push lanes and the NuGet release gate, so the group
# definitions cannot drift between lanes. The caller must have uploaded the
# binaries artifact earlier in the same run.

on:
  workflow_call:
    inputs:
      framework:
        description: 'Test binaries to run: net8.0, net10.0, or aot'
        required: true
        type: string
      kafka-tag:
        description: 'apache/kafka image tag for KafkaIntegrationTest-derived tests'
        required: false
        type: string
        default: '4.3.1'
      fail-fast:
        description: 'Cancel sibling integration groups after the first failure'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  groups:
    name: ${{ matrix.group }} (${{ inputs.framework }}, Kafka ${{ inputs.kafka-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        # Keep the longest groups near seven minutes. ShareConsumer is serial
        # within a runner, so its core and remaining tests need separate VMs.
        # Small connection and transaction categories fill otherwise short jobs.
        group: [connections, resilience, produce, consume, consumer-groups, share-core, share-other, messaging]
        include:
          - group: connections
            categories: Tls,Authentication,Authorization,NetworkPartition,Retry
          - group: resilience
            categories: Resilience
          - group: produce
            categories: Producer,MultiInFlightProducer,Backpressure,Compression,Transaction
          - group: consume
            categories: Consumer,ConsumerLag,Offsets
          - group: consumer-groups
            categories: ConsumerGroup,ShareConsumerAdmin
          - group: share-core
            categories: ShareConsumerCore
          - group: share-other
            categories: ShareConsumerOther
          - group: messaging
            categories: Messaging,MessagingPatterns,MessagingOrdering,Serialization,Interop,Telemetry,Admin

    steps:
      - name: Add Swap Space
        run: |
          sudo fallocate -l 8G /mnt/extra-swapfile
          sudo chmod 600 /mnt/extra-swapfile
          sudo mkswap /mnt/extra-swapfile
          sudo swapon /mnt/extra-swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        if: inputs.framework != 'aot'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup .NET 8 runtime
        if: inputs.framework == 'net8.0'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Download test binaries
        if: inputs.framework != 'aot'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-binaries

      - name: Extract test binaries
        if: inputs.framework != 'aot'
        run: tar -xzf test-binaries.tar.gz

      - name: Download NativeAOT integration executable
        if: inputs.framework == 'aot'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-aot-integration
          path: artifacts/aot/integration

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      # Keep the Ryuk image aligned with DotNet.Testcontainers in Directory.Packages.props.
      - name: Pre-pull integration images
        run: |
          case "${{ matrix.group }}" in
            connections) kafka_tags=("${{ inputs.kafka-tag }}" 4.0.2) ;;
            resilience|produce) kafka_tags=("${{ inputs.kafka-tag }}" 4.0.2 4.2.1) ;;
            messaging) kafka_tags=("${{ inputs.kafka-tag }}" 4.0.2) ;;
            consume|consumer-groups) kafka_tags=("${{ inputs.kafka-tag }}" 4.2.1) ;;
            *) kafka_tags=("${{ inputs.kafka-tag }}") ;;
          esac
          bash scripts/prepull-kafka-images.sh \
            "${kafka_tags[@]}" \
            "testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0"

      - name: Run integration tests
        env:
          KAFKA_TEST_IMAGE_TAG: ${{ inputs.kafka-tag }}
        run: bash scripts/run-integration-categories.sh ${{ inputs.framework }} "${{ matrix.categories }}"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results-integration-${{ inputs.framework }}-${{ inputs.kafka-tag }}-${{ matrix.group }}
          path: |
            **/TestResults/**
            **/test-results/**
          retention-days: 7

      - name: Upload HangDump artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hangdump-artifacts-${{ inputs.framework }}-${{ inputs.kafka-tag }}-${{ matrix.group }}
          path: |
            **/*.dmp
          if-no-files-found: ignore
          retention-days: 7
