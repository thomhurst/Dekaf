name: Benchmarks

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/docs/benchmarks.md'
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: 'Benchmark filter (e.g., *Unit*, *Client*, *Producer*)'
        required: false
        default: '*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true
  Deterministic: true

# Cancel superseded runs: a newer commit on main cancels older in-progress
# benchmark runs. Manual workflow_dispatch runs are never cancelled.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit-benchmarks:
    name: Unit Benchmarks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Exhaustive class-name ranges keep future unit benchmarks sharded
      # automatically. Boundaries are balanced from observed class runtimes.
      matrix:
        include:
          - shard: a-d
            filters: >-
              *Unit.A* *Unit.B* *Unit.C* *Unit.D*
          - shard: e-p
            filters: >-
              *Unit.E* *Unit.F* *Unit.G* *Unit.H* *Unit.I* *Unit.J*
              *Unit.K* *Unit.L* *Unit.M* *Unit.N* *Unit.O* *Unit.P*
          - shard: q-z
            filters: >-
              *Unit.Q* *Unit.R* *Unit.S* *Unit.T* *Unit.U* *Unit.V*
              *Unit.W* *Unit.X* *Unit.Y* *Unit.Z*

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build --configuration Release

      - name: Run Unit Benchmarks
        env:
          BENCHMARK_FILTERS: ${{ matrix.filters }}
        run: |
          cd tools/Dekaf.Benchmarks
          read -r -a benchmark_filters <<< "$BENCHMARK_FILTERS"
          dotnet run -c Release --no-build -- --filter "${benchmark_filters[@]}" --exporters json --artifacts ./BenchmarkResults/Unit

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-unit-${{ matrix.shard }}
          path: tools/Dekaf.Benchmarks/BenchmarkResults/**/results/**
          retention-days: 30

  client-benchmarks:
    name: Client Benchmarks (Dekaf vs Confluent)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      # Broker and benchmark process are pinned to disjoint cores (0-1 vs 2-3 on the
      # 4-vCPU runner) so scheduler interference between them stops randomizing the
      # timed regions — the same discipline the stress runners use. Ratios stay
      # comparable (both clients measured under the same pinning), but absolute
      # times will step-change against pre-pinning history.
      - name: Start Kafka
        run: |
          docker run -d --name kafka \
            --cpuset-cpus 0,1 \
            -p 9092:9092 \
            apache/kafka:latest

          echo "Waiting for Kafka to start..."
          for i in {1..30}; do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null; then
              echo "Kafka is ready"
              break
            fi
            echo "Attempt $i: Kafka not ready yet..."
            sleep 2
          done

      - name: Build
        run: dotnet build --configuration Release

      - name: Run Client Benchmarks
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          cd tools/Dekaf.Benchmarks
          taskset -c 2,3 dotnet run -c Release --no-build -- --filter "*Client*" --exporters json --artifacts ./BenchmarkResults/Client

      - name: Stop Kafka
        if: always()
        run: docker rm -f kafka || true

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-client
          path: tools/Dekaf.Benchmarks/BenchmarkResults/**/results/**
          retention-days: 30

  client-benchmarks-native-memory:
    name: Client Benchmarks with Native Memory (Windows, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # NativeMemoryProfiler makes the producer classes substantially slower,
      # so isolate the P-Z range while keeping both shards below the 90m cap.
      matrix:
        include:
          - shard: a-o
            filters: >-
              *Client.A* *Client.B* *Client.C* *Client.D* *Client.E*
              *Client.F* *Client.G* *Client.H* *Client.I* *Client.J*
              *Client.K* *Client.L* *Client.M* *Client.N* *Client.O*
          - shard: p-z
            filters: >-
              *Client.P* *Client.Q* *Client.R* *Client.S* *Client.T*
              *Client.U* *Client.V* *Client.W* *Client.X* *Client.Y*
              *Client.Z*

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build --configuration Release

      # windows-latest runs Docker in Windows-container mode and cannot pull the Linux
      # Kafka image, so Testcontainers fails. Instead run a native single-node KRaft broker
      # (Java is preinstalled on the runner) and point the benchmarks at it via
      # KAFKA_BOOTSTRAP_SERVERS, which KafkaTestEnvironment uses as an external broker.
      #
      # The broker MUST be started in the same step as the benchmark run: a background
      # process started in an earlier step is killed when that step's shell exits, so a
      # separate "Start Kafka" step leaves the benchmarks with no broker to connect to.
      - name: Run Client Benchmarks with Native Memory Profiler
        shell: pwsh
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          BENCHMARK_FILTERS: ${{ matrix.filters }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          # Set heap explicitly so kafka-server-start.bat skips its wmic-based arch probe
          # (wmic is removed on windows-latest / Server 2025).
          $env:KAFKA_HEAP_OPTS = '-Xmx1G -Xms1G'
          Write-Host "Using JAVA_HOME=$env:JAVA_HOME"

          $version = '4.0.0'
          $pkg = "kafka_2.13-$version"
          Write-Host "Downloading Apache Kafka $version..."
          Invoke-WebRequest -Uri "https://archive.apache.org/dist/kafka/$version/$pkg.tgz" -OutFile kafka.tgz
          tar -xzf kafka.tgz
          $kafka = Join-Path (Get-Location) $pkg

          # Force clients (Confluent + Dekaf) to reconnect to localhost after bootstrap.
          Add-Content "$kafka\config\server.properties" "`nadvertised.listeners=PLAINTEXT://localhost:9092`n"

          # kafka-storage prints a spurious log4j2 status line alongside the UUID, so
          # capture only the line that looks like a Kafka cluster id (22 url-safe chars).
          $clusterId = & "$kafka\bin\windows\kafka-storage.bat" random-uuid 2>&1 |
            Where-Object { $_ -match '^[A-Za-z0-9_-]{22}$' } | Select-Object -First 1
          if (-not $clusterId) { throw 'Could not obtain a Kafka cluster id' }
          Write-Host "Cluster id: $clusterId"
          & "$kafka\bin\windows\kafka-storage.bat" format --standalone --cluster-id $clusterId --config "$kafka\config\server.properties"
          if ($LASTEXITCODE -ne 0) { throw "kafka-storage format failed (exit $LASTEXITCODE)" }

          $proc = Start-Process -FilePath "$kafka\bin\windows\kafka-server-start.bat" `
            -ArgumentList "`"$kafka\config\server.properties`"" `
            -RedirectStandardOutput "$kafka\kafka.out" -RedirectStandardError "$kafka\kafka.err" -PassThru
          Write-Host "Kafka starting (PID $($proc.Id)); waiting for :9092..."

          $ready = $false
          for ($i = 1; $i -le 60; $i++) {
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $c.Connect('127.0.0.1', 9092)
              if ($c.Connected) { $c.Close(); $ready = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ready) {
            Write-Host '----- kafka.out -----'; Get-Content "$kafka\kafka.out" -ErrorAction SilentlyContinue
            Write-Host '----- kafka.err -----'; Get-Content "$kafka\kafka.err" -ErrorAction SilentlyContinue
            throw 'Kafka did not become ready on :9092'
          }
          Write-Host 'Kafka is ready on localhost:9092'

          # Broker is up in this same step; run the benchmarks against it, then stop it.
          # Preserve a benchmark failure after cleanup so the terminal gate reports it.
          $benchmarkExitCode = 0
          try {
            Push-Location tools/Dekaf.Benchmarks
            $benchmarkFilters = $env:BENCHMARK_FILTERS.Split(
              ' ',
              [System.StringSplitOptions]::RemoveEmptyEntries)
            dotnet run -c Release --no-build -- --filter $benchmarkFilters --profiler NativeMemory --exporters json --artifacts ./BenchmarkResults/ClientNative
            $benchmarkExitCode = $LASTEXITCODE
            Write-Host "Benchmark run exited with $benchmarkExitCode"
          } finally {
            Pop-Location
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          if ($benchmarkExitCode -ne 0) {
            throw "Benchmark run failed (exit $benchmarkExitCode)"
          }

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-client-native-${{ matrix.shard }}
          path: tools/Dekaf.Benchmarks/BenchmarkResults/**/results/**
          retention-days: 30

  benchmark-summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [unit-benchmarks, client-benchmarks, client-benchmarks-native-memory]
    if: always()

    steps:
      - name: Download All Results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true

      - name: Generate Benchmark Summary
        run: |
          python3 << 'EOF'
          import os
          import glob

          output = []
          output.append("# Dekaf Benchmark Results\n")

          # Add the BenchmarkDotNet markdown reports directly
          # They have proper tables with Ratio columns

          def append_tables(paths):
              # Extract the markdown tables (all '|' lines onward) from each report file.
              for md in paths:
                  with open(md) as f:
                      in_table = False
                      for line in f.read().split('\n'):
                          if line.startswith('|'):
                              in_table = True
                          if in_table:
                              output.append(line)
                  output.append("")

          # Producer benchmarks
          producer_md = sorted(glob.glob("benchmark-results/Client/results/*ProducerBenchmarks*-github.md"))
          if producer_md:
              output.append("## Producer Benchmarks (Dekaf vs Confluent.Kafka)\n")
              output.append("> **Ratio < 1.0 means Dekaf is faster than Confluent**\n")
              append_tables(producer_md)

          # Consumer benchmarks (ConsumerBenchmarks + ConsumerPollBenchmarks)
          consumer_md = sorted(glob.glob("benchmark-results/Client/results/*Consumer*Benchmarks*-github.md"))
          if consumer_md:
              output.append("## Consumer Benchmarks (Dekaf vs Confluent.Kafka)\n")
              append_tables(consumer_md)

          # Native memory benchmarks (Windows, ETW-based NativeMemoryProfiler)
          native_md = sorted(glob.glob("benchmark-results/ClientNative/results/*Consumer*Benchmarks*-github.md"))
          native_md += sorted(glob.glob("benchmark-results/ClientNative/results/*ProducerBenchmarks*-github.md"))
          if native_md:
              output.append("## Native Memory Comparison (Windows, ETW)\n")
              output.append("> **'Allocated native memory' captures librdkafka's unmanaged allocations, invisible to the managed Allocated column.** Compare Dekaf's Allocated against Confluent's Allocated + Allocated native memory for a fair total.\n")
              append_tables(native_md)

          # Protocol benchmarks (zero-allocation)
          protocol_md = sorted(glob.glob("benchmark-results/Unit/results/*ProtocolBenchmarks*-github.md"))
          if protocol_md:
              output.append("## Protocol Benchmarks (Zero-Allocation Wire Protocol)\n")
              output.append("> **Allocated = `-` means zero heap allocations** ✓\n")
              append_tables(protocol_md)

          # Serializer benchmarks
          serializer_md = sorted(glob.glob("benchmark-results/Unit/results/*SerializerBenchmarks*-github.md"))
          if serializer_md:
              output.append("## Serializer Benchmarks\n")
              append_tables(serializer_md)

          # Compression benchmarks
          compression_md = sorted(glob.glob("benchmark-results/Unit/results/*CompressionBenchmarks*-github.md"))
          if compression_md:
              output.append("## Compression Benchmarks (Snappy)\n")
              append_tables(compression_md)

          output.append("---\n")
          output.append("*Benchmarks run on GitHub Actions (ubuntu-latest) with BenchmarkDotNet*")

          # Write to summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(output))
          EOF

  benchmark-history:
    name: Store Benchmark History
    runs-on: ubuntu-latest
    needs: [unit-benchmarks, client-benchmarks]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true

      - name: Combine Benchmark Results
        run: |
          mkdir -p combined-results

          python3 << 'EOF'
          import json
          import os

          combined = {'Benchmarks': []}
          for root, dirs, files in os.walk('benchmark-results'):
              # ClientNative runs on windows-latest; mixing its timings into the
              # Linux-based history chart would corrupt trend data
              if 'ClientNative' in root:
                  continue
              for f in files:
                  if f.endswith('.json') and 'results' in root:
                      path = os.path.join(root, f)
                      print(f"Processing: {path}")
                      with open(path) as fp:
                          data = json.load(fp)
                          for bench in data.get('Benchmarks', []):
                              stats = bench.get('Statistics')
                              if stats is not None and stats.get('Mean') is not None:
                                  # Publish the median as the tracked value: the
                                  # github-action-benchmark extractor reads Statistics.Mean,
                                  # but client benchmarks are heavy-tailed on shared runners
                                  # (single-invocation iterations produce Error > Mean rows),
                                  # so the median is a far more stable cross-run signal.
                                  if stats.get('Median') is not None:
                                      stats['Mean'] = stats['Median']
                                  combined['Benchmarks'].append(bench)
                              else:
                                  print(f"  Skipping (null Statistics): {bench.get('DisplayInfo', bench.get('Method', 'unknown'))}")

          with open('combined-results/combined.json', 'w') as fp:
              json.dump(combined, fp)

          print(f"\nCombined results: {len(combined['Benchmarks'])} benchmarks")
          EOF

      - name: Store Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Dekaf Benchmarks
          tool: 'benchmarkdotnet'
          output-file-path: combined-results/combined.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@thomholloway'

  publish-to-docs:
    name: Publish Benchmarks to Documentation
    runs-on: ubuntu-latest
    needs: [unit-benchmarks, client-benchmarks, benchmark-history]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true

      - name: Download Benchmark History
        run: |
          git fetch origin gh-pages --depth=1
          git show FETCH_HEAD:dev/bench/data.js > "$RUNNER_TEMP/benchmark-data.js"

      - name: Generate Benchmarks Documentation
        run: >-
          python3 .github/scripts/benchmark_docs.py
          --results-dir benchmark-results
          --history "$RUNNER_TEMP/benchmark-data.js"
          --window 10
          --output docs/docs/benchmarks.md

      - name: Create Pull Request for Benchmark Results
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: Update benchmark results"
          branch: docs/benchmark-results
          title: "docs: Update benchmark results"
          body: "Automated update of benchmark results documentation."
          labels: documentation
          delete-branch: true

      - name: Auto-merge Pull Request
        # NOTE: GITHUB_TOKEN / github-actions[bot] cannot merge here. The default-branch
        # ruleset requires 19 status checks, and on a user-owned repo the bot cannot be a
        # bypass actor. Only Admin/Maintain users can bypass, so --admin must run as a token
        # that represents such a user. BENCHMARK_MERGE_TOKEN is a fine-grained PAT (owner)
        # with Contents: write + Pull requests: write.
        if: steps.cpr.outputs.pull-request-number && steps.cpr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_MERGE_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch --admin

  benchmark-gate:
    name: Benchmark Gate
    runs-on: ubuntu-latest
    needs:
      - unit-benchmarks
      - client-benchmarks
      - client-benchmarks-native-memory
      - benchmark-summary
      - benchmark-history
      - publish-to-docs
    if: always()

    steps:
      - name: Require completed benchmark pipeline
        env:
          UNIT_RESULT: ${{ needs.unit-benchmarks.result }}
          CLIENT_RESULT: ${{ needs.client-benchmarks.result }}
          NATIVE_RESULT: ${{ needs.client-benchmarks-native-memory.result }}
          SUMMARY_RESULT: ${{ needs.benchmark-summary.result }}
          HISTORY_RESULT: ${{ needs.benchmark-history.result }}
          DOCS_RESULT: ${{ needs.publish-to-docs.result }}
        run: |
          failed=0

          check_result() {
            local job_name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job_name concluded '$result'"
              failed=1
            fi
          }

          check_result "Unit Benchmarks" "$UNIT_RESULT"
          check_result "Client Benchmarks" "$CLIENT_RESULT"
          check_result "Client Native Memory Benchmarks" "$NATIVE_RESULT"
          check_result "Benchmark Summary" "$SUMMARY_RESULT"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            check_result "Benchmark History" "$HISTORY_RESULT"
            check_result "Benchmark Documentation" "$DOCS_RESULT"
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
