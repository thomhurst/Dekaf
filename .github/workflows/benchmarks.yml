name: Benchmarks
run-name: PR 3117 pinned dispatch A-B-A
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact fresh-main baseline SHA
        required: true
      candidate_sha:
        description: Exact PR 3117 head SHA
        required: true
permissions:
  contents: read
jobs:
  dispatch-aba:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      ContinuousIntegrationBuild: 'true'
      Deterministic: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Validate harness
        run: python3 -m unittest discover -s .github/benchmarks/dispatch-aba -p 'test_*.py'
      - name: Run pinned phases on this VM
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 .github/benchmarks/dispatch-aba/run.py --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/dispatch-evidence"
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dispatch-3117-${{ github.run_id }}
          path: ${{ runner.temp }}/dispatch-evidence
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
