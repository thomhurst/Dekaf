name: Pool sampler primer diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_TieredCompilation: '1'
      DOTNET_TieredPGO: '1'
      DOTNET_ReadyToRun: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify immutable product, build primer fixture, and trace smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pool_jit_trace.py prepare
      - name: Untraced U1
        run: python3 .github/scripts/pool_jit_trace.py U1
      - name: Traced T
        run: python3 .github/scripts/pool_jit_trace.py T
      - name: Untraced U2
        run: python3 .github/scripts/pool_jit_trace.py U2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pool-sampler-primer
          path: evidence/
          include-hidden-files: true
          retention-days: 90
