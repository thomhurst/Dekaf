name: Pending-request count A-B-A diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_TieredCompilation: '1'
      DOTNET_TieredPGO: '1'
      DOTNET_ReadyToRun: '1'
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build and validate both products
        run: python3 .github/scripts/pool_reset_aba.py prepare
      - name: A1
        run: python3 .github/scripts/pool_reset_aba.py A1
      - name: B
        run: python3 .github/scripts/pool_reset_aba.py B
      - name: A2
        run: python3 .github/scripts/pool_reset_aba.py A2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pool-reset-count-aba
          path: evidence/
          retention-days: 90
