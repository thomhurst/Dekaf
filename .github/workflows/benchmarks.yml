name: Outbox cycle A1-B-A2 diagnostic
run-name: 'Outbox cycle A1-B-A2 ${{ inputs.candidate_sha }}'
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Pinned fresh main, exact 40-character SHA'
        required: true
        type: string
      candidate_sha:
        description: 'Pinned PR #3085 head, exact 40-character SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: outbox-cycle-aba-3085
  cancel-in-progress: false
jobs:
  compare:
    name: 'PR #3085 cycle diagnostic: same-VM A1/B/A2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate evidence handling
        run: python3 -m unittest discover -s .github/scripts -p test_outbox_cycle_aba.py
      - name: Build and validate both revisions, then measure A1/B/A2
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 .github/scripts/outbox_cycle_aba.py \
            --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" \
            --artifacts "$GITHUB_WORKSPACE/outbox-cycle-results"
      - name: Retain all evidence, including failures and loaded binaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: outbox-cycle-aba-${{ github.run_id }}-${{ github.run_attempt }}
          path: outbox-cycle-results/
          if-no-files-found: error
          retention-days: 30
