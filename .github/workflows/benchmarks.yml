name: PR A-B-A (Ubuntu)
run-name: 'A-B-A PR #${{ inputs.pr }} on ubuntu-latest'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR fixture: 3082, 3083, 3085, 3086, 3109, 3116 or 3117'
        required: true
        type: string
      baseline_sha:
        description: 'Exact fresh-main baseline SHA'
        required: true
        type: string
      candidate_sha:
        description: 'Exact rebased PR head SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ubuntu-aba-${{ inputs.pr }}
  cancel-in-progress: false
jobs:
  compare:
    name: 'PR #${{ inputs.pr }}: A-B-A'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate evidence handling
        run: python3 -m unittest discover -s .github/scripts -p test_benchmark_aba.py
      - name: Prepare, validate and measure A-B-A
        env:
          PR: ${{ inputs.pr }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python3 .github/scripts/benchmark_aba.py \
            --pr "$PR" --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" \
            --artifacts "$GITHUB_WORKSPACE/aba-results"
      - name: Upload evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aba-pr-${{ inputs.pr }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: aba-results/
          if-no-files-found: error
          retention-days: 30
