name: Reservoir A-B-A comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      ContinuousIntegrationBuild: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build both revisions and validate fixtures
        run: python3 .github/scripts/reservoir_aba.py prepare
      - name: A1 - baseline pools and producer
        run: python3 .github/scripts/reservoir_aba.py A1
      - name: B - Reservoir 1.7.0 pools and producer
        run: python3 .github/scripts/reservoir_aba.py B
      - name: A2 - baseline pools and producer
        run: python3 .github/scripts/reservoir_aba.py A2
      - name: Compare stress metrics
        if: always()
        run: |
          python3 .github/scripts/stress_aba.py \
            --baseline-a evidence/A1/stress --candidate evidence/B/stress \
            --baseline-a2 evidence/A2/stress \
            --baseline-sha 5df2f0d03607389384b5c1466e17812a9084fac9 \
            --candidate-sha 451d6fb40d907998a1bf72a8c8ca427cb1d85da7 \
            --output evidence/stress-comparison.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reservoir-170-aba
          path: evidence/
          retention-days: 90
