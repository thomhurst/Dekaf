name: Stress Tests
run-name: Five-minute PR A-B-A comparisons (2990, 2992, 2993)
on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Temporary workflow: only the three explicitly pinned PRs'
        required: true
        default: all
      duration_minutes:
        description: 'Measured minutes per revision/configuration; fixed at five'
        default: '5'
      baseline_sha:
        description: 'Exact main SHA'
        default: c5d993b4c3e6390912f22ee2d97bb3482452f13a
permissions:
  contents: read
env:
  ContinuousIntegrationBuild: true
  Deterministic: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  compare:
    name: PR ${{ matrix.pr }} — ${{ matrix.scenario }}
    runs-on: ubicloud-standard-8
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 2990
            sha: 9778462c0d380e331684eb0ae9cd4d8f392c089c
            scenario: producer-async
            lingers: '0 5'
            gc_adaptation: '1'
          - pr: 2992
            sha: 3d12aeef9dd45e196c7700230801ed7b821b17bc
            scenario: consumer
            lingers: '5'
            gc_adaptation: '0'
          - pr: 2993
            sha: 647afa58f4c0ad32209507a4300047dd57fada50
            scenario: consumer
            lingers: '5'
            gc_adaptation: '0'
    env:
      PR_NUMBER: ${{ matrix.pr }}
      CANDIDATE_SHA: ${{ matrix.sha }}
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      SCENARIO: ${{ matrix.scenario }}
      LINGERS: ${{ matrix.lingers }}
      DOTNET_GCDynamicAdaptationMode: ${{ matrix.gc_adaptation }}
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_TEST_IMAGE_TAG: '4.3.1'
      BROKER_CPUS: 0-5
      CLIENT_CPUS: 6,7
      BROKER_TMPFS: 6g
      BROKER_HEAP: '-Xms2g -Xmx2g'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate bounded dispatch
        shell: bash
        run: |
          [[ "$DURATION_MINUTES" == 5 ]]
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline_sha }}
          path: versions/main
          persist-credentials: false
      - name: Checkout PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          path: versions/candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build both revisions before measurement
        shell: bash
        run: |
          mkdir -p evidence
          test "$(git -C versions/main rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C versions/candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          dotnet build versions/main/tools/Dekaf.StressTests -c Release > evidence/build-main.log 2>&1 || { tail -60 evidence/build-main.log; exit 1; }
          dotnet build versions/candidate/tools/Dekaf.StressTests -c Release > evidence/build-candidate.log 2>&1 || { tail -60 evidence/build-candidate.log; exit 1; }
          lscpu > evidence/cpu.txt
          dotnet --info > evidence/dotnet.txt
          uname -a > evidence/os.txt
      - name: Run bracketing five-minute comparisons
        shell: bash
        run: bash .github/pr-comparison/run.sh
      - name: Summarize all available metrics
        if: always()
        shell: bash
        run: python3 .github/pr-comparison/report.py evidence --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-${{ matrix.pr }}-five-minute-comparison
          path: evidence/
          retention-days: 90
      - name: Stop task broker
        if: always()
        run: docker rm -f kafka || true
