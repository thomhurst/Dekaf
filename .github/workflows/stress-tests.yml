name: Stress Tests
run-name: Producer release comparison - whole-core affinity and 8 counterbalanced samples
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-comparison:
    runs-on: ubicloud-standard-8
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Compare published package with pinned candidate
        run: bash tools/ProducerReleaseComparison/run.sh
      - name: Retain complete experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: producer-release-comparison
          path: comparison-results/
          retention-days: 30
