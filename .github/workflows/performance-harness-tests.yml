name: Performance harness tests
on:
  pull_request:
    paths:
      - '.github/benchmarks/**'
      - '.github/scripts/**'
      - '.github/workflows/performance-comparison.yml'
      - 'global.json'
      - 'Directory.Packages.props'
      - 'Directory.Build.*'
      - '.github/workflows/performance-harness-tests.yml'
      - 'tools/Admin*Evidence/**'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Test recorder and comparison drivers
        run: |
          dotnet test --project .github/benchmarks/admin-recorder-tests/Recorder.Tests.csproj -c Release
          for test in test_verify_performance_pins.py test_stress_warmup.py test_stress_aba_startup.py test_reservoir_fixture.py test_runner_affinity.py test_admin_refresh.py test_outbox_cycle_aba.py test_outbox_loaded_aba.py test_pool_loaded_aba.py; do
            python3 -m unittest discover -s .github/scripts -p "$test"
          done
          python3 -m unittest discover -s .github/benchmarks/dispatch-aba -p 'test_*.py'
          python3 -m unittest discover -s .github/benchmarks/share-loaded -p 'test_*.py'
          python3 -m unittest discover -s .github/benchmarks/pool-loaded/tests -p 'test_*.py'
          dotnet test --project .github/benchmarks/pool-loaded/tests/IntervalLatency.Tests.csproj -c Release
          for project in AdminDescriptionEvidence AdminShareOffsetEvidence AdminMemberRemovalEvidence; do
            python3 -m unittest discover -s "tools/$project" -p test_comparison.py
          done
          python3 -m unittest discover -s tools/AdminMutationEvidence -p test_validate_results.py
      - name: Build and replay administrative fixture smoke
        run: python3 .github/scripts/smoke_admin_harness.py
      - name: Verify BenchmarkDotNet isolation and allocation reports
        working-directory: .github/benchmarks/aba-smoke
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: |
          results="$GITHUB_WORKSPACE/.artifacts/bdn-smoke"
          mkdir -p "$results"
          dotnet build Smoke.csproj -c Release --disable-build-servers > "$results/build.log" 2>&1
          settings=(--warmupCount 3 --iterationCount 3 --iterationTime 100 --launchCount 1 --outliers DontRemove)
          dotnet run -c Release --no-build -- --filter '*SmokeBenchmarks*' "${settings[@]}" --artifacts "$results/timing" > "$results/timing.log" 2>&1
          jq -e '.Benchmarks | length == 2 and all(.[]; . as $case | .Statistics.N == 3 and any(.Metrics[]; .Descriptor.Id == "Allocated Memory" and .Value == (if $case.Method == "Allocate" then 1048 else 0 end)))' "$results/timing/results/"*-report-full.json
          test "$(grep 'SMOKE workload-pid=' "$results/timing.log" | sort -u | wc -l)" -eq 2
          compare=(jq -nr --argjson tolerance 5 -f "$GITHUB_WORKSPACE/.github/scripts/compare_bdn_reports.jq")
          jq -s '[.[].Benchmarks[]] | sort_by([.Namespace, .Type, .Method, .Parameters])' "$results/timing/results/"*-report-full.json > "$results/same.json"
          jq '[.[] | .Statistics.Mean *= 1.1]' "$results/same.json" > "$results/slower.json"
          jq '[.[] | .Statistics.Mean *= 1.06]' "$results/same.json" > "$results/drifted.json"
          jq '[.[] | .Statistics.Mean *= 1.03]' "$results/same.json" > "$results/nearer.json"
          jq '[.[] | (.Metrics[] | select(.Descriptor.Id == "Allocated Memory") | .Value) += 8]' "$results/same.json" > "$results/allocating.json"
          jq '.[:1]' "$results/same.json" > "$results/partial.json"
          screen() { "${compare[@]}" --arg format json --slurpfile a1 "$results/$1.json" --slurpfile b "$results/$2.json" --slurpfile a2 "$results/$3.json"; }
          screen same same same | jq -e '.screen == "PASS" and (.cases | length) == 2 and all(.cases[]; .screen == "PASS" and .b_vs_a1_percent == 0 and .drift_percent == 0)'
          screen same slower same | jq -e '.screen == "REGRESSION" and all(.cases[]; .screen == "REGRESSION")'
          screen same allocating same | jq -e '.screen == "REGRESSION" and all(.cases[]; .screen == "REGRESSION")'
          screen same same drifted | jq -e '.screen == "INCONCLUSIVE" and all(.cases[]; .screen == "NOISE")'
          screen same drifted nearer | jq -e '.screen == "INCONCLUSIVE" and all(.cases[]; .screen == "INCONCLUSIVE")'
          screen slower same slower | jq -e '.screen == "PASS" and all(.cases[]; .screen == "IMPROVEMENT")'
          if screen same partial same > /dev/null 2>&1; then echo 'Mismatched case sets were compared'; exit 1; fi
          "${compare[@]}" --arg format markdown --slurpfile a1 "$results/same.json" --slurpfile b "$results/same.json" --slurpfile a2 "$results/same.json" | grep -q 'Micro screen: \*\*PASS\*\*'
          if SMOKE_FAIL_SETUP=1 dotnet run -c Release --no-build -- --job Dry --filter '*NoAllocation*' --artifacts "$results/failure" > "$results/failure.log" 2>&1; then
            echo 'A failing fixture returned success'; exit 1
          fi
          if dotnet run -c Release --no-build -- --job Dry --filter '*DoesNotExist*' --artifacts "$results/empty" > "$results/empty.log" 2>&1; then
            echo 'An empty selection returned success'; exit 1
          fi
      - name: Verify copied comparison project discovery
        env:
          ABA_PR: '3158'
          ABA_ROLE: A
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: |
          results="$GITHUB_WORKSPACE/.artifacts/comparison-discovery"
          mkdir -p "$results"
          cp -R .github/benchmarks/aba .performance
          cp global.json Directory.Packages.props .performance/
          cd .performance
          dotnet build Dekaf.Benchmarks.csproj -c Release --disable-build-servers > "$results/build.log" 2>&1
          dotnet run --project Dekaf.Benchmarks.csproj -c Release --no-build -- --job Dry --filter '*ShareResponseFrameBench*' --artifacts "$results/dry" > "$results/dry.log" 2>&1
          jq -s -e '[.[].Benchmarks[]] | length == 6 and all(.[]; .Statistics.N == 1)' "$results/dry/results/"*-report-full.json
      - name: Verify Linux client and broker affinity
        run: |
          python3 .github/scripts/test_runner_affinity.py --linux-smoke
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-harness-tests
          include-hidden-files: true
          path: |
            .artifacts/admin-smoke/
            .artifacts/bdn-smoke/
            .artifacts/comparison-discovery/
            TestResults/
