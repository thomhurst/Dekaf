name: Performance tooling tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/benchmarks/README.md'
      - '.github/benchmarks/STANDARD-TOOLS.md'
      - '.github/workflows/performance-gate.yml'
      - '.github/workflows/performance-harness-tests.yml'
      - 'tools/Dekaf.Benchmarks/**'
      - 'global.json'
      - 'Directory.Packages.props'
      - 'Directory.Build.*'
      - 'src/**'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Test benchmark and stress result validation
        run: |
          for test in test_performance_gate.py test_check_repository_artifacts.py test_stress_warmup.py test_stress_aba.py test_stress_aba_startup.py; do
            python3 -m unittest discover -s .github/scripts -p "$test"
          done
      - name: Verify the benchmark project exports what the gate screens
        working-directory: tools/Dekaf.Benchmarks
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: |
          results="$GITHUB_WORKSPACE/.artifacts/bdn-smoke"
          mkdir -p "$results"
          # BDN searches for a solution to discover the project for its generated worker (PR #3180).
          dotnet new sln --name GateBenchmarkExecution --format sln > "$results/solution.log"
          dotnet sln GateBenchmarkExecution.sln add Dekaf.Benchmarks.csproj >> "$results/solution.log"
          dotnet build Dekaf.Benchmarks.csproj -c Release --disable-build-servers > "$results/build.log" 2>&1
          dotnet run --project Dekaf.Benchmarks.csproj -c Release --no-build -- \
            --filter '*.Unit.ValueTaskSourcePoolBenchmarks.RentReturnSameThread' '*.Unit.ConsumerHotPathBenchmarks.ConsumeBatch_String_Deserialize' \
            --warmupCount 3 --iterationCount 3 --iterationTime 100 --launchCount 1 --outliers DontRemove \
            --exporters fulljson --buildTimeout 900 --artifacts "$results/timing" > "$results/timing.log" 2>&1
          # Identical exports in every phase must screen PASS with both a 0 B/op and an allocating case.
          python3 "$GITHUB_WORKSPACE/.github/scripts/performance_gate.py" screen --a1 "$results/timing" --b "$results/timing" \
            --a2 "$results/timing" --iterations 3 --name smoke --output "$results/same.json" --markdown "$results/same.md"
          python3 - "$results/same.json" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['screen'] == 'PASS' and len(report['cases']) == 2, report['screen']
          allocated = sorted(case['B']['allocated_bytes'] for case in report['cases'])
          assert allocated[0] == 0 < allocated[1], allocated
          EOF
          cat "$results/same.md" >> "$GITHUB_STEP_SUMMARY"
          echo 'Standard BenchmarkDotNet export smoke passed; this short run is not performance acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain original exports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-tooling-tests
          path: .artifacts/bdn-smoke/
