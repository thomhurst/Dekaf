name: Performance gate
run-name: 'Performance gate ${{ github.event.pull_request.number && format(''PR #{0}'', github.event.pull_request.number) || github.ref_name }}'
# Same-VM A1/B/A2 microbenchmark screen for pull requests that change product source or
# benchmark fixtures. One job per selected benchmark class keeps the two baseline controls
# minutes apart. The PR's fixture source is built against both product revisions, so a PR can
# add or change fixtures without landing them on main first. Thresholds, the repeat rule and
# the class selection live in .github/scripts/performance_gate.py.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tools/Dekaf.Benchmarks/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/performance-gate.yml'
      - '.github/scripts/performance_gate.py'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Baseline commit (default: merge base of the dispatched ref with main)'
        required: false
      head_sha:
        description: 'Candidate commit (default: the dispatched ref)'
        required: false
      filters:
        description: 'BenchmarkDotNet globs, space separated (default: selected from the changed paths)'
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: performance-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  # Identical in every phase: about 15 s per case per phase, so a 16-case class measures all three
  # phases in about 12 minutes and the two controls stay minutes apart.
  BDN_SETTINGS: '--warmupCount 10 --iterationCount 15 --iterationTime 500 --launchCount 1 --outliers DontRemove --exporters fulljson --buildTimeout 900'
  ITERATIONS: '15'
jobs:
  plan:
    name: Select benchmark classes
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.pins.outputs.base }}
      head: ${{ steps.pins.outputs.head }}
      applicable: ${{ steps.select.outputs.applicable }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # The default checkout carries the gate tooling; the measured commits are fetched separately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Pin the baseline and candidate commits
        id: pins
        env:
          BASE_INPUT: ${{ inputs.base_sha }}
          HEAD_INPUT: ${{ github.event.pull_request.head.sha || inputs.head_sha || github.sha }}
        run: |
          git fetch --no-tags origin main "$HEAD_INPUT"
          head=$(git rev-parse "$HEAD_INPUT^{commit}")
          if [[ -n "$BASE_INPUT" ]]; then
            git fetch --no-tags origin "$BASE_INPUT"
            base=$(git rev-parse "$BASE_INPUT^{commit}")
          else
            base=$(git merge-base "$head" origin/main)
          fi
          git worktree add --detach "$RUNNER_TEMP/head" "$head"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          {
            echo "## Performance gate"
            echo
            echo "Baseline A: \`$base\` · Candidate B: \`$head\` · main at start: \`$(git rev-parse origin/main)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # A manual dispatch may compare any two commits (for example a merged change against its
          # parent, in reverse); say so when the baseline is not an ancestor so a mistyped base_sha is visible.
          if ! git merge-base --is-ancestor "$base" "$head"; then
            echo "::warning::Baseline $base is not an ancestor of candidate $head; this is a free-form comparison. Check base_sha if that is unexpected."
            echo "The baseline is not an ancestor of the candidate (free-form comparison)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Select benchmark classes from the changed paths
        id: select
        env:
          FILTERS: ${{ inputs.filters }}
        run: |
          mkdir -p gate
          python3 .github/scripts/performance_gate.py select \
            --base "${{ steps.pins.outputs.base }}" --head "${{ steps.pins.outputs.head }}" --root "$RUNNER_TEMP/head" \
            --filters "$FILTERS" --output gate/selection.json --github-output "$GITHUB_OUTPUT"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          selection = json.load(open('gate/selection.json'))
          print()
          if selection['classes']:
              print('Measured classes: ' + ', '.join(f'`{item["name"]}`' for item in selection['classes']))
          else:
              print('No steady-state benchmark class maps to these changes; nothing was measured.')
          for item in selection['skipped']:
              print(f'- skipped `{item["name"]}`: {item["reason"]}')
          EOF

  measure:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    # About 30 s per case per phase including BenchmarkDotNet overhead; a 16-case class with a
    # repeated regression needs roughly 50 minutes.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GATE: ${{ github.workspace }}/gate
      BASE_SHA: ${{ needs.plan.outputs.base }}
      HEAD_SHA: ${{ needs.plan.outputs.head }}
      NAME: ${{ matrix.name }}
      FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Build the PR fixtures against both product revisions
        run: |
          mkdir -p "$GATE"
          lscpu > "$GATE/cpu.txt"
          dotnet --info > "$GATE/runtime.txt"
          echo "### $NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline A \`$BASE_SHA\` · Candidate B \`$HEAD_SHA\` · $(lscpu | sed -n 's/^Model name: *//p' | head -n 1) · runner $RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
          git fetch --no-tags --depth 1 origin "$BASE_SHA" "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/gate-A" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/gate-B" "$HEAD_SHA"
          build() {
            (
              cd "$RUNNER_TEMP/gate-$1/tools/Dekaf.Benchmarks"
              rm -f GateBenchmarkExecution.sln
              # BDN looks for a solution to locate the project for its generated worker (PR #3180).
              dotnet new sln --name GateBenchmarkExecution --format sln > "$GATE/solution-$1.log" 2>&1
              dotnet sln GateBenchmarkExecution.sln add Dekaf.Benchmarks.csproj >> "$GATE/solution-$1.log" 2>&1
              dotnet build Dekaf.Benchmarks.csproj -c Release --disable-build-servers > "$GATE/build-$1.log" 2>&1
            )
          }
          # The baseline measures the candidate's fixture source, so fixtures added or changed by
          # the PR compare on both revisions. If they need APIs the baseline lacks, fall back to the
          # baseline's own fixtures and compare only the common cases; a class the PR adds then has
          # no baseline benchmark at all, so only the candidate is measured and reported.
          rm -rf "$RUNNER_TEMP/gate-A/tools/Dekaf.Benchmarks"
          cp -R "$RUNNER_TEMP/gate-B/tools/Dekaf.Benchmarks" "$RUNNER_TEMP/gate-A/tools/Dekaf.Benchmarks"
          build B &
          candidate_build=$!
          if build A; then
            echo 'Baseline built the candidate fixture source.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice::The PR fixtures do not build against the baseline; the baseline measures its own fixtures. Cases from fixture files that differ are reported, not compared.'
            mv "$GATE/build-A.log" "$GATE/build-A-candidate-fixtures.log"
            (cd "$RUNNER_TEMP/gate-A" && git checkout -- tools/Dekaf.Benchmarks && git clean -fdxq tools/Dekaf.Benchmarks)
            build A
            touch "$GATE/baseline-fixtures"
            echo 'Baseline built its own fixture source (the candidate fixtures need newer APIs); cases whose fixture file differs are reported, not compared.' >> "$GITHUB_STEP_SUMMARY"
            # `--list flat` prints one full name per benchmark the filter matches and nothing else.
            (cd "$RUNNER_TEMP/gate-A/tools/Dekaf.Benchmarks" && dotnet run --project Dekaf.Benchmarks.csproj -c Release --no-build -- \
              --list flat --filter "$FILTER" > "$GATE/baseline-list.txt" 2>&1)
            if ! grep -q '^Dekaf\.' "$GATE/baseline-list.txt"; then
              touch "$GATE/baseline-lacks-filter"
              echo "::notice::The baseline has no benchmark matching $FILTER (the PR adds the class); only the candidate is measured and its cases are reported, not compared."
              echo "The baseline has no benchmark matching \`$FILTER\`; the candidate is measured alone and reported as NOT COMPARED." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if ! wait "$candidate_build"; then
            echo "::error::The candidate fixtures failed to build against $HEAD_SHA; see build-B.log in the job artifact."
            exit 1
          fi
          dotnet build-server shutdown > /dev/null 2>&1 || true
      - name: Measure A1, B and A2 back to back
        run: |
          # shellcheck disable=SC2086
          phase() {
            local name=$1 role=$2
            shift 2
            (
              cd "$RUNNER_TEMP/gate-$role/tools/Dekaf.Benchmarks"
              dotnet run --project Dekaf.Benchmarks.csproj -c Release --no-build -- \
                --filter "$@" $BDN_SETTINGS --artifacts "$GATE/$name" > "$GATE/$name.log" 2>&1
            )
          }
          gate=".github/scripts/performance_gate.py"
          FIXTURE_DIFF=()
          if [[ -f "$GATE/baseline-fixtures" ]]; then FIXTURE_DIFF=(--fixture-diff "$BASE_SHA" "$HEAD_SHA"); fi
          if [[ -f "$GATE/baseline-lacks-filter" ]]; then
            # The class does not exist on the baseline: no control can be measured, so the candidate runs alone.
            FIXTURE_DIFF+=(--baseline-lacks-filter)
            mkdir -p "$GATE/A1" "$GATE/A2"
            phase B B "$FILTER"
          else
            phase A1 A "$FILTER"; phase B B "$FILTER"; phase A2 A "$FILTER"
          fi
          code=0
          python3 "$gate" screen --a1 "$GATE/A1" --b "$GATE/B" --a2 "$GATE/A2" --iterations "$ITERATIONS" --name "$NAME" "${FIXTURE_DIFF[@]}" \
            --output "$GATE/comparison.json" --markdown "$GATE/comparison.md" --regressed "$GATE/regressed.txt" || code=$?
          if [[ $code -eq 1 ]]; then
            # A regression must reproduce on an immediate repeat of exactly those cases.
            mapfile -t filters < "$GATE/regressed.txt"
            echo "::notice::First pass regressed ${#filters[@]} case(s); repeating them before deciding."
            phase repeat-A1 A "${filters[@]}"; phase repeat-B B "${filters[@]}"; phase repeat-A2 A "${filters[@]}"
            code=0
            python3 "$gate" screen --a1 "$GATE/repeat-A1" --b "$GATE/repeat-B" --a2 "$GATE/repeat-A2" --iterations "$ITERATIONS" \
              --name "$NAME" --previous "$GATE/comparison.json" "${FIXTURE_DIFF[@]}" --output "$GATE/final.json" --markdown "$GATE/final.md" || code=$?
          elif [[ $code -eq 0 ]]; then
            cp "$GATE/comparison.json" "$GATE/final.json"
            cp "$GATE/comparison.md" "$GATE/final.md"
          fi
          if [[ -f "$GATE/final.md" ]]; then { echo; cat "$GATE/final.md"; echo; } >> "$GITHUB_STEP_SUMMARY"; fi
          case $code in
            0) ;;
            1) echo "::error::$NAME: REGRESSION reproduced against both controls. See the table above and the retained BenchmarkDotNet exports." ;;
            *) echo "::error::$NAME: the measurement is invalid (missing cases, iterations or MemoryDiagnoser output). Fix the fixture or the run; this is not a performance verdict." ;;
          esac
          exit $code
      - name: Show logs of a failed measurement
        if: failure()
        run: |
          for log in "$GATE"/build-*.log "$GATE"/*.log; do
            if [[ -f "$log" ]]; then echo "::group::$(basename "$log")"; tail -n 40 "$log"; echo '::endgroup::'; fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: performance-gate-${{ github.run_id }}-class-${{ matrix.name }}
          path: gate/
          retention-days: 30

  gate:
    name: Micro A1/B/A2 screen
    needs: [plan, measure]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Combine the class verdicts
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLICABLE: ${{ needs.plan.outputs.applicable }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          if [[ "$PLAN_RESULT" != success ]]; then
            echo '::error::Selecting benchmark classes failed; no verdict is available.'
            exit 1
          fi
          if [[ "$APPLICABLE" != true ]]; then
            echo 'No steady-state benchmark class maps to these changes; nothing was measured.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$MEASURE_RESULT" != success ]]; then
            echo '::error::At least one benchmark class regressed or failed to measure. Open that job for its table and retained BenchmarkDotNet exports.'
            exit 1
          fi
          echo 'Micro screen PASS: no class regressed against both controls.' | tee -a "$GITHUB_STEP_SUMMARY"
