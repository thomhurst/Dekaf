name: Stress Tests
run-name: PR 2990 zero-linger allocation diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ContinuousIntegrationBuild: true
  Deterministic: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BASELINE_SHA: c5d993b4c3e6390912f22ee2d97bb3482452f13a
  CANDIDATE_SHA: 9778462c0d380e331684eb0ae9cd4d8f392c089c
  PR_NUMBER: '2990'
  LINGERS: '0'
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  KAFKA_TEST_IMAGE_TAG: '4.3.1'
  DOTNET_GCDynamicAdaptationMode: '1'
  BROKER_CPUS: 0-4
  BROKER_TMPFS: 6g
  BROKER_HEAP: '-Xms2g -Xmx2g'
jobs:
  diagnose:
    runs-on: ubicloud-standard-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: versions/main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: versions/candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build before measurement and install pinned profiler
        shell: bash
        run: |
          mkdir -p evidence
          for version in main candidate; do
            dotnet build "versions/$version/tools/Dekaf.StressTests" -c Release > "evidence/build-$version.log" 2>&1 || { tail -60 "evidence/build-$version.log"; exit 1; }
            dotnet build "versions/$version/tools/Dekaf.TraceAnalyzer" -c Release >> "evidence/build-$version.log" 2>&1 || { tail -60 "evidence/build-$version.log"; exit 1; }
          done
          trace_version=$(jq -er '.tools["dotnet-trace"].version' .config/stress-diagnostics/dotnet-tools.json)
          dotnet tool install --global dotnet-trace --version "$trace_version"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          lscpu > evidence/cpu.txt
          lscpu -e > evidence/cpu-topology.txt
          dotnet --info > evidence/dotnet.txt
      - name: Profile main then PR then main
        shell: bash
        run: bash .github/pr-comparison/profile-zero.sh
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-2990-zero-linger-diagnosis
          path: evidence/
          retention-days: 90
      - name: Stop task broker
        if: always()
        run: docker rm -f kafka || true
