name: Stress Tests
run-name: PR 2993 pooled scheduler wait - exact parent A-B-A
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ContinuousIntegrationBuild: true
  Deterministic: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  compare:
    runs-on: ubicloud-standard-8
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6aabd518dbde30505fe354b6149ad1c3eddbf19
          path: versions/main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a68ca4a2265de539762d192b16ab0b9a48f39f34
          path: versions/candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Compare actual scheduler waits and full wake cycles
        shell: bash
        run: bash .github/pr-comparison/scheduler-wait.sh
      - name: Upload complete benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-2993-pooled-scheduler-wait
          path: evidence/
          retention-days: 90
