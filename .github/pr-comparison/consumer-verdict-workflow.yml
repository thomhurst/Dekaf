name: Stress Tests
run-name: Consumer PR verdicts - warmed raw delivery A-B-A
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ContinuousIntegrationBuild: true
  Deterministic: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CLIENT_CPUS: 6,7
  BROKER_CPUS: 0-5
  BROKER_TMPFS: 6g
  BROKER_HEAP: '-Xms2g -Xmx2g'
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  KAFKA_TEST_IMAGE_TAG: '4.3.1'
  DOTNET_GCDynamicAdaptationMode: '1'
jobs:
  compare:
    runs-on: ubicloud-standard-8
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0795104e659924694747647f539d73e084bb5234
          path: versions/main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6aabd518dbde30505fe354b6149ad1c3eddbf19
          path: versions/fetch
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d12aeef9dd45e196c7700230801ed7b821b17bc
          path: versions/pool
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Build exact revisions with identical delivery measurement
        shell: bash
        run: |
          mkdir -p evidence
          python3 .github/pr-comparison/consumer-latency.py versions/main versions/fetch versions/pool
          for version in main fetch pool; do
            git -C "versions/$version" diff -- tools/Dekaf.StressTests/Scenarios/ConsumerRawStressTest.cs > "evidence/harness-$version.patch"
            sha256sum "versions/$version/tools/Dekaf.StressTests/Scenarios/ConsumerRawStressTest.cs" >> evidence/harness-hashes.txt
            dotnet build "versions/$version/tools/Dekaf.StressTests" -c Release > "evidence/build-$version.log" 2>&1 || { tail -60 "evidence/build-$version.log"; exit 1; }
          done
          test "$(cut -d' ' -f1 evidence/harness-hashes.txt | sort -u | wc -l)" = 1
          lscpu -e > evidence/cpu-topology.txt
          lscpu > evidence/cpu.txt
          dotnet --info > evidence/dotnet.txt
      - name: Compare main-fetch-main-pool-main on one VM
        shell: bash
        run: bash .github/pr-comparison/consumer-verdict.sh
      - name: Apply consumer Pareto comparison
        if: always()
        run: python3 .github/pr-comparison/consumer-verdict.py report evidence
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-warmed-raw-verdicts
          path: evidence/
          retention-days: 90
      - name: Stop task broker
        if: always()
        run: docker rm -f kafka || true
