name: Stress Tests
run-name: Consumer bottleneck candidates - targeted microbenchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ContinuousIntegrationBuild: true
  Deterministic: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  microbenchmarks:
    runs-on: ubicloud-standard-8
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5d993b4c3e6390912f22ee2d97bb3482452f13a
          path: versions/main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d12aeef9dd45e196c7700230801ed7b821b17bc
          path: versions/pool-before
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: afa6eefef34f0d5f38e91bc77f3a9cde664f4407
          path: versions/pool-candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 647afa58f4c0ad32209507a4300047dd57fada50
          path: versions/fetch-before
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6aabd518dbde30505fe354b6149ad1c3eddbf19
          path: versions/fetch-candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Compare pool and scheduler candidates sequentially
        shell: bash
        run: bash .github/pr-comparison/micro.sh
      - name: Upload all benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-bottleneck-microbenchmarks
          path: evidence/
          retention-days: 90
