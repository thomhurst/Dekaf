syntax = "proto2";

package dekaf.validation;

import "confluent/meta.proto";

option csharp_namespace = "Dekaf.Tests.Unit.SchemaRegistry.ProtobufFixtures";

message Proto2ValidationMessage {
  optional int32 value = 1 [(confluent.field_meta) = {
    rules: {
      name: "positive-when-present"
      expr: "this > 0"
    }
  }];

  optional group Details = 2 [(confluent.field_meta) = {
    rules: {
      name: "group-value-positive"
      expr: "this.value > 0"
    }
  }] {
    optional int32 value = 3;
  }
}

message Proto2PresenceValidationMessage {
  option (confluent.message_meta) = {
    rules: {
      name: "absent-proto2-scalar-uses-default"
      expr: "!has(this.value) && this.value == 0"
    }
  };

  optional int32 value = 1;
}
