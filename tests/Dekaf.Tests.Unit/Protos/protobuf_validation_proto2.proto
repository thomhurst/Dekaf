syntax = "proto2";

package dekaf.validation;

import "confluent/meta.proto";

option csharp_namespace = "Dekaf.Tests.Unit.SchemaRegistry.ProtobufFixtures";

message Proto2ValidationMessage {
  optional int32 value = 1 [(confluent.field_meta) = {
    rules: {
      name: "positive-when-present"
      expr: "this > 0"
    }
  }];

  optional group Details = 2 [(confluent.field_meta) = {
    rules: {
      name: "group-value-positive"
      expr: "this.value > 0"
    }
  }] {
    optional int32 value = 3;
  }
}

message Proto2PresenceValidationMessage {
  option (confluent.message_meta) = {
    rules: {
      name: "absent-proto2-scalar-uses-default"
      expr: "!has(this.value) && this.value == 0 && !has(this.limit) && this.limit == 5 && !has(this.label) && this.label == 'legacy' && !has(this.token) && this.token == b'\\x01\\xff' && !has(this.enabled) && this.enabled && !has(this.status) && this.status == 1"
    }
  };

  optional int32 value = 1;
  optional int32 limit = 2 [default = 5];
  optional string label = 3 [default = "legacy"];
  optional bytes token = 4 [default = "\001\377"];
  optional bool enabled = 5 [default = true];
  optional Proto2PresenceStatus status = 6 [default = PROTO2_PRESENCE_STATUS_ACTIVE];
}

message Proto2PackedEnumValidationMessage {
  repeated Proto2PresenceStatus statuses = 1 [packed = true, (confluent.field_meta) = {
    rules: {
      name: "known-packed-status-count"
      expr: "size(this) <= 1"
    }
  }];
}

enum Proto2PresenceStatus {
  PROTO2_PRESENCE_STATUS_UNSPECIFIED = 0;
  PROTO2_PRESENCE_STATUS_ACTIVE = 1;
}
