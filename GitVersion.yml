mode: ContinuousDelivery
# Versions are chosen by editing the tag of the draft release before publishing it (see
# .github/workflows/release-draft.yml), not by +semver: commit messages. GitVersion only suggests
# the draft's version: on main, the next patch after the latest release tag.
commit-message-incrementing: Disabled
branches:
  main:
    mode: ContinuousDeployment
    label: ''
    increment: Patch
  develop:
    mode: ContinuousDelivery
    label: alpha
    increment: Minor
  feature:
    regex: ^features?[/-](?<BranchName>.+)
    label: alpha.{BranchName}
    increment: Inherit
  release:
    regex: ^releases?[/-]
    label: rc
    increment: None
  hotfix:
    regex: ^hotfix(es)?[/-]
    label: beta
    increment: Patch
  pull-request:
    regex: ^(pull|pull-requests|pr)[/-](?<Number>\d+)
    label: pr.{Number}
    increment: Inherit
